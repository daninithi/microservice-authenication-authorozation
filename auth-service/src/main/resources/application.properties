spring.application.name=auth-service
server.port=${SERVER_PORT:8083}

# Database (secrets come from environment variables, never from this file)
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates/updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info

# Requests come through the API Gateway. Read the real client IP from the
# X-Forwarded-For header the gateway adds (needed for the login rate limit).
server.forward-headers-strategy=native

# The same JWT_SECRET is shared with the API Gateway,
# so it can check the tokens this service creates
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${TOKEN_EXPIRE_TIME:900000}
jwt.cookie-secure=${COOKIE_SECURE:true}

# Optional: create the first ADMIN account at startup (see AdminAccountInitializer)
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
