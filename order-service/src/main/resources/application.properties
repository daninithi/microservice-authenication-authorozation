spring.application.name=order-service
server.port=${SERVER_PORT:8081}

# Local PostgreSQL configuration
spring.datasource.url=${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Direct service-to-service call to product-service (not through the API Gateway)
product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
spring.cloud.openfeign.httpclient.hc5.enabled=true

